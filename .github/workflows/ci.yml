name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'refactor/**'
      - 'chore/**'
      - 'fix/**'
      - 'docs/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build, migrations and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
      DB_LOGGING: 'false'
      BOT_ENABLED: 'false'
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run migrations
        run: pnpm --filter @expense-tracker/database migration:run

      - name: Show migration status
        run: pnpm --filter @expense-tracker/database migration:show

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t expense-tracker:ci .

      - name: Run container
        run: |
          docker run -d --name expense-tracker-ci --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/expense_tracker_docker \
            -e BOT_ENABLED=false \
            -e JWT_ACCESS_SECRET=ci-access-secret \
            -e JWT_REFRESH_SECRET=ci-refresh-secret \
            -e COOKIE_SECURE=false \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e PORT=8080 \
            expense-tracker:ci

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done

          echo 'Health check failed. Container logs:'
          docker logs expense-tracker-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f expense-tracker-ci || true
